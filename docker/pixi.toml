[project]
name = "biapy"
version = "3.6.8"
description = "BiaPy: Bioimage analysis pipelines in Python"
channels = ["nvidia", "conda-forge", "pytorch"]
platforms = ["linux-64"]

[dependencies]
python = ">=3.11,<3.12"

# CUDA toolkit from nvidia channel
cuda-toolkit = ">=12.8,<13"

# PyTorch with CUDA support from pytorch channel
pytorch = ">=2.5"
torchvision = ">=0.20"

# BiaPy core dependencies
numpy = ">=1.26,<2"
matplotlib = ">=3.7"
scikit-learn = ">=1.4"
scikit-image = ">=0.21"
pandas = ">=1.5"
h5py = ">=3.9"
pyyaml = ">=6.0"
tqdm = ">=4.66"
opencv = ">=4.8"
imagecodecs = ">=2024.1"
pooch = ">=1.8"
pip = ">=24"

[pypi-dependencies]
biapy = { path = "/src", editable = false }
